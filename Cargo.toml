[package]
name = "connor"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A terminal text editor for working alongside a coding agent"

[dependencies]
crossterm = "0.29"
# Walks the project tree respecting .gitignore (ripgrep's walker).
ignore = "0.4"
notify = "8.2"
# Fuzzy matching for the file picker (Helix's matcher core).
nucleo-matcher = "0.3"
# Default features off: unicode_lines makes bare \r (and VT/FF/NEL/LS/PS)
# break lines, but connor treats only \n and \r\n as terminators.
ropey = { version = "1.6", default-features = false, features = ["simd"] }
# Incremental parsing for syntax highlighting; grammars compile in
# statically, so the binary stays self-contained.
tree-sitter = "0.26"
tree-sitter-md = "0.5"
tree-sitter-rust = "0.24"
unicode-segmentation = "1"
unicode-width = "0.2"

# Already in the tree via crossterm, so this adds no new crates.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
